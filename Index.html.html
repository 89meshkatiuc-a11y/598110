{t:'یخ‌ساز مرموز',d:'تفریق عدد منفی',ic:['🧪','⚙️','🧊'],g:['#3d1f6d','#7a54b8','#1e0e3c'],

{t:'کارخانه‌ی تکرار',d:'ضرب عدد مثبت در هر عدد',ic:['🏭','📦','⏱️'],g:['#2f8f6a','#c8f0b8','#1d5a42'],

function scene(i,h){const L=LV[i],c=L.g;let b='',s=i*13+5;
 for(let k=0;k<9;k++){s=(s*37+11)%97;const w=28+s%20,t=34+s%40,x=k*45+2;
  b+=`<rect x="${x}" y="${110-t}" width="${w}" height="${t}" fill="${c[2]}"/>`;

 return`<svg class="sc" viewBox="0 0 400 130" role="img" aria-label="${L.t}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="400" height="130" fill="url(#g)"/>${b}<rect y="110" width="400" height="20" fill="${c[2]}"/><text x="200" y="64" font-size="46" text-anchor="middle">${L.ic[0]}</text><text x="50" y="40" font-size="24">${L.ic[1]}</text><text x="330" y="40" font-size="24">${L.ic[2]}</text><text x="200" y="104" font-size="22" text-anchor="middle">${'🔥'.repeat(h)}</text></svg>`}
function line(a){const X=n=>200+n*15;let t='';
 for(let n=-12;n<=12;n++){const g=n%5===0;t+=`<line x1="${X(n)}" x2="${X(n)}" y1="${g?44:47}" y2="${g?66:60}" stroke="var(--mut)" stroke-width="${g?1.6:1}"/>`;if(g)t+=`<text x="${X(n)}" y="80" font-size="11" text-anchor="middle" fill="var(--ink)">${rs(n)}</text>`}
 return`<svg viewBox="0 0 400 90" role="img" aria-label="محور اعداد"><line x1="8" x2="392" y1="53" y2="53" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>${t}<line id="seg" x1="0" x2="0" y1="53" y2="53" stroke="var(--acc2)" stroke-width="5" stroke-linecap="round" opacity="0"/><circle cx="${X(a)}" cy="53" r="4.5" fill="var(--acc2)"/><text id="pet" x="0" y="0" font-size="24" text-anchor="middle" style="transform:translate(${X(a)}px,40px)">🏃</text></svg>`}
function G(i){if(i===9)i=R(1,8);const m=x=>R(0,1)?x:-x;let a,b,o='+';
 if(i===1){const s=m(1);a=s*R(1,6);b=s*R(1,6)}
 else if(i===2){const s=m(1);a=s*R(1,9);b=R(0,3)?-s*R(1,9):-a}
 else if(i===3){do{a=m(R(1,9));b=m(R(1,9))}while(A(a+b)>12)}
 else if(i===4){o='\u2212';do{a=m(R(1,9));b=R(1,9)}while(A(a-b)>12)}
 else if(i===5){o='\u2212';do{a=m(R(1,9));b=-R(1,9)}while(A(a-b)>12)}

 return{i,a,b,o,r:o==='+'?a+b:o==='\u2212'?a-b:o==='\u00d7'?a*b:a/b}}
function story(q){const{a,b,i}=q;

 if(i===2)return`در اتاق ${fa(A(a))} واحد ${a>0?'گرما':'سرما'} هست و ${fa(A(b))} واحد ${b>0?'گرما':'سرما'} هم وارد می‌شود. تعادل نهایی؟`;
 if(i===3)return`آسانسور در طبقه‌ی ${rs(a)} است و ${fa(A(b))} طبقه ${b>0?'بالا':'پایین'} می‌رود. به کدام طبقه می‌رسد؟`;
 if(i===4)return`دمای انبار ${rs(a)}° است. ${fa(b)} درجه گرما از آن کم می‌کنیم. دمای جدید؟`;
 if(i===5)return`دمای انبار ${rs(a)}° است. ${fa(A(b))} درجه سرمای اضافی را برمی‌داریم. دمای جدید؟`;
 if(i===6)return`${fa(a)} ساعت پشت‌سرهم، هر ساعت دما ${rs(b)} درجه تغییر می‌کند. تغییر کل؟`;

 return`چون ${par(r)} \u00d7 ${par(b)} = ${par(a)}، پس ${par(a)} \u00f7 ${par(b)} = ${rs(r)}. ${(a<0)===(b<0)?'هم‌علامت':'ناهم‌علامت'} ← جواب ${r>0?'مثبت':'منفی'}.`}
function opts(q){const r=q.r;let s=[...new Set([-r,r+1,r-1,r+2,r-2,q.a+q.b,q.a-q.b])].filter(x=>x!==r);shuf(s);s=s.slice(0,3);
 while(s.length<3){const x=r+R(-6,6);if(x!==r&&!s.includes(x))s.push(x)}return shuf([r,...s])}

function map(){app.innerHTML=`<h1>ماموریت آن سوی صفر</h1><p class="sub">طوفان صفر کنترل دمای شهر را خراب کرده. تو مهندس شهر هستی و فقط با فهمیدن اعداد صحیح می‌توانی آن را نجات بدهی.</p>
<div class="city">${LV.map((L,i)=>`<span style="opacity:${i<P.n?1:.25}">${L.ic[1]}</span>`).join('')}</div>
${LV.map((L,i)=>`<button class="stage" ${i>P.n?'disabled':''} onclick="lesson(${i})"><span class="ic">${i<P.n?'✅':L.ic[0]}</span><span>${fa(i+1)}. ${L.t}<small>${L.d}</small></span></button>`).join('')}`}
const hdr=()=>`<div class="top"><button class="ghost" onclick="map()">نقشه</button><b>${LV[S.i].t}</b></div>`;
function lesson(i){S={i,ok:0,heat:0};const L=LV[i];
 app.innerHTML=`${hdr()}${scene(i,0)}<div class="card"><p>${L.st}</p><p class="key">💡 ${L.key}</p></div>
 <div class="card"><b>پیش از شروع، فکر کن:</b><p>${L.ct}</p>${shuf(L.co.map((t,k)=>[t,k])).map(([t,k])=>`<button class="opt2" onclick="cc(${k},this)">${t}</button>`).join('')}<div id="cx"></div></div>`}
function cc(k,b){if(k===0){document.querySelectorAll('.opt2').forEach(x=>x.disabled=true);b.classList.add('ok');
 document.getElementById('cx').innerHTML=`<p><b class="g">درسته!</b> ${LV[S.i].ce}</p><button class="go" onclick="play()">شروع مأموریت</button>`}
 else{b.classList.add('no');b.disabled=true;document.getElementById('cx').innerHTML='<p>هنوز نه؛ دوباره فکر کن و گزینه‌ی دیگری را امتحان کن. 🤔</p>'}}
function play(){S.ok=0;S.heat=0;nextQ()}
function nextQ(){const q=G(S.i+1);S.q=q;S.lock=0;const lin=q.o==='+'||q.o==='\u2212';
 app.innerHTML=`${hdr()}${scene(S.i,S.heat)}<div class="bar"><i style="width:${S.ok/6*100}%"></i></div>
 <div class="card"><p>${story(q)}</p><div class="eq">${par(q.a)} ${q.o} ${par(q.b)} = ?</div>${lin?line(q.a):''}</div>
 <div id="st"><p class="q">۱) پیش از حساب کردن: جواب چه علامتی دارد؟</p><div class="opts3">${['مثبت','منفی','صفر'].map((t,k)=>`<button class="opt2" onclick="sgn(${k},this)">${t}</button>`).join('')}</div></div><div id="vs"></div><div id="fb"></div>`}
function sgn(k,b){if(S.lock)return;const q=S.q,c=q.r>0?0:q.r<0?1:2;
 document.querySelectorAll('#st .opt2').forEach(x=>x.disabled=true);
 if(k===c){b.classList.add('ok');document.getElementById('vs').innerHTML=`<p class="q">۲) حالا مقدار جواب را پیدا کن:</p><div class="opts">${opts(q).map(v=>`<button class="opt" data-v="${v}" onclick="val(${v})">${rs(v)}</button>`).join('')}</div>`}
 else{b.classList.add('no');done(0,1)}}
function val(v){if(S.lock)return;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const x=+b.dataset.v;if(x===S.q.r)b.classList.add('ok');else if(x===v)b.classList.add('no')});done(v===S.q.r,0)}
function done(ok,sw){const q=S.q;S.lock=1;ok?S.ok++:S.heat++;
 const pet=document.getElementById('pet');if(pet){const X=n=>200+n*15,s=document.getElementById('seg');pet.style.transform=`translate(${X(q.r)}px,40px)`;s.setAttribute('x1',X(q.a));s.setAttribute('x2',X(q.r));s.setAttribute('opacity','.9')}
 document.querySelector('.sc').outerHTML=scene(S.i,S.heat);
 const fin=S.ok>=6,dead=S.heat>=3;
 document.getElementById('fb').innerHTML=`<div class="fb"><b class="${ok?'g':'r'}">${ok?'درست! ✅':sw?'علامت جواب اشتباه بود؛ ساختمان داغ می‌شود 🔥':'اشتباه شد؛ ساختمان داغ می‌شود 🔥'}</b><div class="eqs">${par(q.a)} ${q.o} ${par(q.b)} = ${par(q.r)}</div><p>${why(q)}</p></div><button class="go" onclick="${dead?'fail()':fin?'endL()':'nextQ()'}">${dead?'ادامه':fin?'نجات شهر!':'سؤال بعدی'}</button>`;
 document.querySelector('.go').scrollIntoView({block:'nearest'})}
function fail(){app.innerHTML=`${hdr()}${scene(S.i,3)}<div class="card res"><div class="big">🔥</div><h2>ساختمان بیش از حد داغ شد!</h2><p>اشکالی ندارد؛ مهندس‌ها از اشتباه یاد می‌گیرند. درس را یک بار دیگر ببین و دوباره تلاش کن.</p><button class="go" onclick="lesson(${S.i})">مرور درس و تلاش دوباره</button></div>`}
function endL(){P.n=Math.max(P.n,S.i+1);sv();const L=LV[S.i],last=S.i===LV.length-1;
 app.innerHTML=`${hdr()}${scene(S.i,0)}<div class="card res"><div class="big">${last?'🏆':'🎉'}</div><h2>${last?'شهر ترمو نجات پیدا کرد!':'مأموریت موفق!'}</h2><p>${L.th}</p>
 ${last?'<p>تو حالا فقط جواب نمی‌دهی؛ می‌فهمی چرا جواب این است.</p>':''}
 <button class="go" onclick="${last?'map()':`lesson(${S.i+1})`}">${last?'بازگشت به نقشه':'مرحله‌ی بعد'}</button></div>`}
map();
</script></body></html>
